# web/ をCloudflare Pagesへ手動デプロイするワークフロー。
# 実行前に以下のリポジトリSecretsを設定しておくこと:
#   CLOUDFLARE_API_TOKEN  - Pages:Edit権限
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_PAGES_PROJECT - Pagesのプロジェクト名（例: aibo-web）
#
# TODO（初回実デプロイ前に対応）: 素の`next build`の出力はそのままでは
# Pagesにデプロイできない。Cloudflare向けのNext.jsアダプタ
# （@opennextjs/cloudflare もしくは @cloudflare/next-on-pages）をweb/に導入し、
# ビルドステップの出力先を合わせた上で、下記`directory:`も変更すること。
name: Deploy web to Cloudflare Pages

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: web/.next
