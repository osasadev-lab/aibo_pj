# web/ をCloudflare Workersへ手動デプロイするワークフロー（@opennextjs/cloudflare使用）。
# Next.js 16は@cloudflare/next-on-pages（Cloudflare Pages向け旧アダプタ）が
# 未対応のため、Cloudflare自身が現在推奨しているWorkers向けアダプタに切り替えている。
# デプロイ先はPagesダッシュボードではなくWorkersダッシュボードになる点に注意。
#
# 実行前に以下のリポジトリSecretsを設定しておくこと:
#   CLOUDFLARE_API_TOKEN  - Workers Scripts:Edit権限
#   CLOUDFLARE_ACCOUNT_ID
#
# worker名はweb/wrangler.jsoncの"name"（aibo-web）で管理する。
name: Deploy web to Cloudflare Workers

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx opennextjs-cloudflare build
        env:
          # NEXT_PUBLIC_*はnext buildの時点でクライアントバンドルに焼き込まれるためbuildステップで渡す。
          # いずれも公開して問題ない値（API URL、SupabaseのPublishable/anon key）なので直書きしている。
          NEXT_PUBLIC_API_BASE_URL: https://aibo-server-494998752926.asia-northeast1.run.app/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://ktmnkhfhzevytocbccka.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ohm0W0h8RKBjlVwk6i_MNg_T5_fAkQ2
      - run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
